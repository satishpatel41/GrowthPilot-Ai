<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leads pipeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#101828;background:#F6F7F5}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;font-weight:600}
p{margin:0}
a{color:inherit;text-decoration:none}
input,select{font:400 14px Inter,sans-serif;color:#101828;border:1px solid #D0D5DD;border-radius:8px;background:#fff;box-sizing:border-box;height:40px;padding:0 12px}
</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;background:#F6F7F5">

<aside style="flex:0 0 248px;background:#101828;color:#fff;padding:20px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">
<a href="#" style="display:flex;align-items:center;gap:10px;padding:0 8px">
<span style="width:32px;height:32px;border-radius:8px;background:#0F766E;display:inline-flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></span>
<span style="font:600 17px 'Space Grotesk',sans-serif">GrowthPilot AI</span>
</a>
<nav style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
<a href="#" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;background: {{n.bg}}; color: {{n.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg><span>{{n.label}}</span></a>
</sc-for>
</nav>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
<a href="#" style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;color:#D0D5DD"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Support</span></a>
<div style="border-top:1px solid #1D2939;padding:16px 8px 0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:14px;font-weight:600">Shree Textile House</span>
<span style="font-size:13px;color:#98A2B3">Growth plan</span>
</div>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;padding:32px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">

<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:4px">
<h1 style="font-size:28px;letter-spacing:-0.01em">Leads</h1>
<p style="font-size:14px;color:#475467">Enquiries from your website, landing pages, Facebook lead forms and WhatsApp</p>
</div>
<button type="button" style="height:40px;padding:0 16px;border-radius:8px;border:1px solid #0F766E;background:#0F766E;font:500 14px Inter,sans-serif;color:#fff">Add lead</button>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<div style="display:flex;gap:12px;flex-wrap:wrap">
<input type="search" placeholder="Search name or phone" aria-label="Search leads" style="width:260px">
<select aria-label="Filter by source"><option>All sources</option><option>Website form</option><option>Landing page</option><option>Facebook lead form</option><option>WhatsApp</option><option>Manual entry</option></select>
<select aria-label="Filter by assignee"><option>Everyone</option><option>Agency team</option><option>Unassigned</option></select>
</div>
<div style="display:inline-flex;padding:3px;border:1px solid #D0D5DD;border-radius:10px;background:#fff">
<button type="button" style="height:32px;padding:0 16px;border-radius:7px;border:0;background:#101828;font:500 13px Inter,sans-serif;color:#fff">Pipeline</button>
<button type="button" style="height:32px;padding:0 16px;border-radius:7px;border:0;background:transparent;font:500 13px Inter,sans-serif;color:#344054">List</button>
</div>
</div>

<div style="display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:8px">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="6">
<section style="flex:1 1 176px;min-width:176px;background:#EEF0F3;border-radius:12px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px">
<h2 style="font-size:14px">{{col.name}}</h2>
<span style="min-width:22px;height:22px;border-radius:999px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#344054">{{col.count}}</span>
</div>
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="3">
<article style="background:#fff;border:1px solid #E4E7EC;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:14px;font-weight:600">{{c.name}}</span>
<span style="font-size:12px;color:#475467">{{c.phone}}</span>
<span style="font-size:13px;line-height:1.4">{{c.service}}</span>
<span style="align-self:flex-start;padding:2px 8px;border-radius:999px;background:#F2F4F7;color:#344054;font-size:11px;font-weight:500">{{c.source}}</span>
<span style="align-self:flex-start;padding:2px 8px;border-radius:999px;background: {{c.flagBg}}; color: {{c.flagFg}}; font-size:11px;font-weight:500; display: {{c.flagShow}}">{{c.flag}}</span>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #EAECF0;padding-top:8px;margin-top:2px">
<span style="font-size:12px;font-weight:500;color: {{c.dueColor}}">{{c.due}}</span>
<span aria-label="Assigned to {{c.owner}}" style="width:24px;height:24px;border-radius:999px;background:#E6F4F1;color:#0B5B55;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center">{{c.initials}}</span>
</div>
</article>
</sc-for>
</section>
</sc-for>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
renderVals() {
const items = [
['Dashboard', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'],
['Content calendar', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
['AI assistant', 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z'],
['Leads', 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'],
['Campaigns', 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12'],
['Social accounts', 'M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7'],
['Reports', 'M3 3v18h18M7 15l4-4 3 3 5-6'],
['Billing', 'M2 5h20v14H2zM2 10h20']
];
const nav = items.map(([label, d], i) => ({ label, d, bg: i === 3 ? '#1D2939' : 'transparent', fg: i === 3 ? '#fff' : '#D0D5DD' }));

const mk = (name, phone, service, source, due, owner, opts = {}) => {
const late = opts.late;
const flag = opts.flag || '';
const initials = owner === 'Unassigned' ? '?' : owner.split(' ').map((w) => w[0]).join('');
return {
name, phone, service, source, due, owner, initials,
dueColor: late ? '#B42318' : '#475467',
flag,
flagShow: flag ? 'inline-block' : 'none',
flagBg: opts.flagBg || '#FEF3C7',
flagFg: opts.flagFg || '#92400E'
};
};

const columns = [
{ name: 'New', cards: [
mk('Meera Shah', '+91 98••• ••412', 'Bridal wear', 'Facebook lead form', 'Follow up today', 'Agency team'),
mk('Rakesh Desai', '+91 97••• ••058', 'Bulk fabric order', 'WhatsApp', 'Follow up 18 Nov', 'Agency team'),
mk('Kinjal Mehta', '+91 99••• ••731', 'Wedding collection', 'Landing page', 'Follow up 18 Nov', 'Unassigned', { flag: 'Possible duplicate' }),
mk('Amit Joshi', '+91 90••• ••265', 'Uniform fabric', 'Website form', 'Follow up 19 Nov', 'Unassigned')
] },
{ name: 'Contacted', cards: [
mk('Hetal Patel', '+91 98••• ••940', 'Festival wear', 'WhatsApp', 'Overdue · 15 Nov', 'Agency team', { late: true }),
mk('Nilesh Rana', '+91 93••• ••117', 'Curtain fabric', 'Website form', 'Follow up 19 Nov', 'Agency team'),
mk('Pooja Trivedi', '+91 94••• ••802', 'Bridal wear', 'Manual entry', 'Follow up 20 Nov', 'Agency team')
] },
{ name: 'Qualified', cards: [
mk('Sanjay Modi', '+91 98••• ••376', 'Showroom order', 'Google campaign', 'Follow up 18 Nov', 'Agency team'),
mk('Bhavna Kapadia', '+91 95••• ••629', 'Wedding collection', 'Facebook lead form', 'Follow up 21 Nov', 'Agency team')
] },
{ name: 'Proposal sent', cards: [
mk('Dilip Thakkar', '+91 98••• ••214', 'Hotel linen supply', 'Website form', 'Follow up 20 Nov', 'Agency team'),
mk('Anita Gandhi', '+91 91••• ••483', 'Bulk uniforms', 'Landing page', 'Follow up 22 Nov', 'Agency team')
] },
{ name: 'Converted', cards: [
mk('Ritu Parekh', '+91 98••• ••705', 'Bridal wear', 'WhatsApp', 'Closed 12 Nov', 'Agency team'),
mk('Mahesh Naik', '+91 97••• ••339', 'Showroom order', 'Website form', 'Closed 9 Nov', 'Agency team')
] },
{ name: 'Lost', cards: [
mk('Chirag Vyas', '+91 90••• ••581', 'Curtain fabric', 'Facebook lead form', 'Closed 7 Nov', 'Agency team')
] }
].map((c) => ({ ...c, count: c.cards.length }));
return { nav, columns };
}
}
</script>
</body>
</html>
